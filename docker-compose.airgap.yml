# Overlay for air-gapped installs. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.airgap.yml up -d
#
# The images are loaded locally by airgap-load.sh under the `memclaw-onprem/`
# namespace, so we swap ghcr.io/caura-ai/<name>:<version> for the local tag.

services:
  platform-storage-api:
    image: "memclaw-onprem/platform-storage:${CAURA_VERSION:-${MEMCLAW_VERSION:-latest}}"  # legacy-name-ok: dual-read of the old spelling, which rule 3 keeps working
  platform-auth-api:
    image: "memclaw-onprem/platform-auth:${CAURA_VERSION:-${MEMCLAW_VERSION:-latest}}"  # legacy-name-ok: dual-read of the old spelling, which rule 3 keeps working
  platform-admin-api:
    image: "memclaw-onprem/platform-admin:${CAURA_VERSION:-${MEMCLAW_VERSION:-latest}}"  # legacy-name-ok: dual-read of the old spelling, which rule 3 keeps working
  platform-audit-api:
    image: "memclaw-onprem/platform-audit:${CAURA_VERSION:-${MEMCLAW_VERSION:-latest}}"  # legacy-name-ok: dual-read of the old spelling, which rule 3 keeps working
  core-storage-api:
    image: "memclaw-onprem/core-storage:${CAURA_VERSION:-${MEMCLAW_VERSION:-latest}}"  # legacy-name-ok: dual-read of the old spelling, which rule 3 keeps working
  core-api:
    # Default = slim core-api. Overridden again by docker-compose.embedder.yml
    # to memclaw-onprem/core-api-embedder:<version> when local embeddings
    # are needed (air-gap + no OpenAI/Vertex key).
    image: "memclaw-onprem/core-api:${CAURA_VERSION:-${MEMCLAW_VERSION:-latest}}"  # legacy-name-ok: dual-read of the old spelling, which rule 3 keeps working
  app-frontend:
    image: "memclaw-onprem/app:${CAURA_VERSION:-${MEMCLAW_VERSION:-latest}}"  # legacy-name-ok: dual-read of the old spelling, which rule 3 keeps working
  # gateway image is built locally (see docker-compose.yml); override is a no-op
  gateway:
    image: "memclaw-onprem/gateway:${CAURA_VERSION:-${MEMCLAW_VERSION:-latest}}"  # legacy-name-ok: dual-read of the old spelling, which rule 3 keeps working
