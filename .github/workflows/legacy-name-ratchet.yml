name: Legacy-name ratchet

# Hard rule 7 of the rebrand sunset plan: mint nothing new carrying the old
# brand. Every new one adds a redirect somebody has to keep forever and spends a
# rename option that was already paid for.
#
# This repo needs the gate more than most, and can afford a sweep less than any:
# it is public, customers run it on their own hardware, and most of its ~530
# old-brand lines are contract rather than prose -- install paths written to
# customer disks, air-gapped image names the customer already holds in a
# tarball, the shipped CLI's own command, and an environment-variable family
# operators hand-edit in install.conf. Those are load-bearing and stay. So the
# gate holds the count flat rather than demanding zero: nothing new, nothing
# swept.
#
# Deliberately carries no literal occurrence of the old name itself, so the gate
# never has to grant its own definition an exemption.
#
# The script and tests are copied byte-for-byte from caura-ai/caura, where the
# same pair gates the OSS tree. That is an intent, not an invariant: nothing here
# enforces it, and the check is a plain diff against the OSS copy. The point of
# copying rather than adapting is that the diff stays empty, so any drift is one
# line to spot instead of two implementations to reconcile.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ratchet:
    name: Legacy-name ratchet
    runs-on: ubuntu-latest
    # Seconds of work; the only thing that can hang is the fetch.
    timeout-minutes: 5
    steps:
      # depth=1 is enough. On a pull_request the checkout is already the merge
      # commit, so main's tree is the exact base for this PR's contribution and
      # no merge-base walk is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      # The gate's own tests run before the gate does. A ratchet that has
      # silently stopped matching reports a clean tree and passes every PR from
      # then on, which is the one failure mode that hides itself -- so the copy
      # gets checked here rather than trusted because it was correct upstream.
      - name: The gate's own tests
        # Same constraint the OSS repo resolves these tests against, so the copy
        # runs on the version it was written for. Bounded below the next major
        # because a breaking pytest release here would redden every PR in the
        # repo -- this step gates other people's work, not just its own.
        run: |
          python -m pip install --disable-pip-version-check --quiet 'pytest>=9.1.1,<10.0'
          python -m pytest tests/test_legacy_name_ratchet.py -q

      - name: No new old-brand names
        run: |
          git fetch --no-tags --depth=1 origin main
          python scripts/legacy_name_ratchet.py --base origin/main
