name: Lint and type-check

# The first lint or type gate this repo has ever had. It ran pytest already --
# env-dual-read.yml runs the suite in tests/ and the shipped CLI's own suite --
# but nothing had ever run ruff or mypy over any of the 11 Python files here.
#
# That matters more here than the file count suggests: two of those files are the
# programme's own gates (the legacy-name ratchet and the do-not-touch sentinel).
# A gate nobody type-checks is a gate that can rot into passing, and this repo is
# also public and customer-installed.
#
# SCOPES ARE ASYMMETRIC ON PURPOSE, and each side is what was measured to pass.
# The alternative -- one job that lints everything and fixes ~20 findings in the
# same commit -- is not reviewable, so the job lands at the scope that is green
# and gets widened deliberately.
#
#   mypy      scripts/ + tests/ + the CLI's src and tests -- i.e. everything.
#             Clean today, so all of it is gated from the start.
#   ruff      scripts/ only. Outside it there are 15 `ruff check` findings and 5
#             files `ruff format` would rewrite. Those are worth fixing, and
#             widening this step is the follow-up that does it; they are not
#             worth bundling into the commit that introduces the job.
#
# Of those 15, five are RUF100 -- `# noqa` directives that suppress nothing.
# Nobody could have known: no linter had ever run over the files carrying them.
#
# `--check-untyped-defs` IS THE STEP. Without it this gate would be close to
# hollow, which is the failure it exists to prevent. mypy leaves it off by
# default and therefore skips the bodies of unannotated functions -- which is
# almost all test code here. Measured both ways: the one real error this job
# found (an unguarded `re.search(...).group(1)` in tests/, fixed in the same
# commit) is reported WITH the flag and is invisible without it, on the same
# files. A green gate that reads nothing is worse than no gate, because it looks
# like coverage.
#
# `ruff==0.16.0` is pinned exactly, not floored. This repo has no ruff config, so
# the rule set IS whatever the pinned version ships -- 413 rules at 0.16, up from
# 59 before it. That expansion reddened caura and caura-enterprise (OSS #684,
# enterprise #879/#898) and is why common/ in both repos now carries an explicit
# common/ruff.toml. An exact pin means a bump changes the enforced rule set only
# when someone edits this line, rather than the next time the runner resolves a
# newer ruff.
#
# scripts/legacy_name_ratchet.py is vendored byte-for-byte from caura-ai/caura and
# this step is the FIRST place it is lint-gated: OSS CI's ruff scopes do not
# include its root scripts/, and caura-ops excludes the file from its own ruff
# hooks because that repo wraps at 100 columns while the file is written at 88.
# It is included here, and passes, precisely because this repo has no ruff config
# and ruff's default line-length is 88 -- the style the file is already in. So
# nothing gets reformatted and re-vendoring stays a clean diff. Adding a ruff
# config here with a different line-length would break that, and would need the
# caura-ops treatment (exclude from ruff, keep in mypy) rather than a reformat.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint and type-check
    runs-on: ubuntu-latest
    # Seconds of work: 11 files, no database, no container, no fetch.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # Matches the other workflows here. Note the CLI's pyproject allows
          # >=3.10, and mypy is told to assume THIS version, so a 3.11+ builtin
          # it uses is checked as available -- which is correct for the version
          # that is actually run, and would need revisiting if the floor
          # started being tested.
          python-version: "3.13"

      - name: Install the checkers, pytest and the CLI
        # Three things, and each is load-bearing for the mypy step rather than
        # for running anything:
        #
        # * pytest, because six of the eleven files `import pytest` and this job
        #   does NOT pass --ignore-missing-imports. Without it installed mypy
        #   reports import-not-found for every one of them -- which is exactly
        #   what the first run of this workflow did. Same constraint the repo's
        #   other three gates pin, so all four resolve the same pytest.
        # * the CLI package, so click / httpx / rich resolve the same way.
        #
        # Not passing --ignore-missing-imports is the deliberate part. It would
        # have made that first failure disappear, and it would equally hide a
        # genuinely missing dependency later. Installing what the code imports
        # is the honest fix; suppressing the report is not.
        run: |
          python -m pip install --disable-pip-version-check --quiet 'ruff==0.16.0' 'mypy>=2.3.0,<3.0' 'pytest>=9.1.1,<10.0'
          python -m pip install --disable-pip-version-check --quiet ./tools/memclawctl  # legacy-name-floor: the shipped CLI's path

      - name: Ruff lint
        run: ruff check scripts/

      - name: Ruff formatter check
        # Separate step from the lint above, deliberately: code can pass
        # `ruff check` and still fail `ruff format --check`, so folding them
        # into one step hides which contract broke.
        run: ruff format --check scripts/

      - name: mypy
        # The CLI's src and tests are named individually rather than passing its
        # parent directory. The install step above builds the package in place,
        # leaving tools/<cli>/build/lib/<cli>/ behind, and mypy handed the parent
        # finds the same module twice and fails with "Duplicate module" before
        # checking anything. Naming the two real source directories avoids it
        # without an --exclude that would then need keeping in sync with
        # setuptools' choice of build directory.
        run: mypy --check-untyped-defs scripts/ tests/ tools/memclawctl/src tools/memclawctl/tests  # legacy-name-floor: the shipped CLI's path
