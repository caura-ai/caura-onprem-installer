[project]
name = "cauractl"
version = "0.1.0"
description = "Day-2 operations CLI for on-prem Caura deployments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Caura Team", email = "dev@caura.io" }]
dependencies = [
    "click>=8.1,<9.0",
    "httpx>=0.27,<1.0",
    "rich>=13.0,<14.0",
]

[project.scripts]
# Both names, one implementation. ``cauractl`` is the name from here on; the
# older one stays because it is on operators' disks and in runbooks, and rule 3
# keeps it working -- it is an alias to keep, not a spelling to migrate off.
cauractl = "cauractl.cli:cli"
memclawctl = "cauractl.cli:cli"  # legacy-name-ok: permanent console-script alias, which rule 3 keeps working

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
